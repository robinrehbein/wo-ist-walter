name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # ubuntu-Runner bringen ein Android SDK mit (ANDROID_HOME)
      - name: Check Android SDK
        run: test -d "$ANDROID_HOME" && echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Tests und Debug-APK
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: wuselburg-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
